name: Release

# Stable proprietary releases only. The pushed v* tag must match package.json.
# The gate is not re-run here: @minimal-agent/core is a private git dependency
# this repo's GITHUB_TOKEN cannot install. The umbrella repo
# (gastonmorixe/minimal-agent) gates the pinned commit before a release.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate tag matches package.json
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' package.json)"
          TAG="${GITHUB_REF#refs/tags/}"
          LABEL="${TAG#v}"
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "could not read version from package.json" >&2
            exit 1
          fi
          if [[ "${LABEL}" == *"-nightly."* ]]; then
            echo "minimal-agent-cli does not publish nightlies; refusing ${TAG}" >&2
            exit 1
          fi
          if [[ "${LABEL}" != "${VERSION}" ]]; then
            echo "stable tag ${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=minimal-agent-cli ${TAG}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          prerelease: false
