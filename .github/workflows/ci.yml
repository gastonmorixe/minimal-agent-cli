name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Allow reading private core
        env:
          TOKEN: ${{ secrets.SUBMODULES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::Set the SUBMODULES_PAT secret (read access to minimal-agent-core). bun install needs it for the @minimal-agent/core git dependency."
            exit 1
          fi
          # Bun may fetch a GitHub dependency as a tarball or with git. Cover both.
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GITHUB_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile
      - name: Validate current commit
        if: github.event_name == 'push'
        run: bun run commitlint:last
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: bunx --bun commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Allow reading private core
        env:
          TOKEN: ${{ secrets.SUBMODULES_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::Set the SUBMODULES_PAT secret (read access to minimal-agent-core). bun install needs it for the @minimal-agent/core git dependency."
            exit 1
          fi
          # Bun may fetch a GitHub dependency as a tarball or with git. Cover both.
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GITHUB_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile
      - name: Run check
        run: bun run check
